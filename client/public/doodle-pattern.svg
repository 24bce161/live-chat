    <!-- 24. Rocket (Row 4 Far Right) -->
    <g transform="translate(530, 345) rotate(-35)">
      <path d="M 12 0 C 20 4 22 16 20 24 L 4 24 C 2 16 4 4 12 0 Z" />
      <circle cx="12" cy="11" r="3" />
      <path d="M 4 18 L 0 26 M 20 18 L 24 26" />
      <path d="M 8 24 L 12 30 L 16 24" />
    </g>

    <!-- 25. Trophy (Row 5 Left) -->
    <g transform="translate(35, 465) rotate(-8)">
      <path d="M 4 2 H 24 V 12 C 24 18 19 22 14 22 C 9 22 4 18 4 12 Z" />
      <path d="M 4 6 H 0 V 10 C 0 13 3 14 4 14 M 24 6 H 28 V 10 C 28 13 25 14 24 14" />
      <path d="M 14 22 V 27 M 8 27 H 20" />
    </g>

    <!-- 26. Shield with Checkmark (Row 5 Middle Left) -->
    <g transform="translate(135, 460) rotate(12)">
      <path d="M 12 2 L 2 6 V 14 C 2 20 12 26 12 26 C 12 26 22 20 22 14 V 6 Z" />
      <polyline points="7,13 10,16 17,9" />
