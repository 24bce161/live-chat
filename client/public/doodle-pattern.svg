    <!-- 27. Envelope / Mail (Row 5 Center) -->
    <g transform="translate(230, 465) rotate(-5)">
      <rect x="0" y="4" width="26" height="18" rx="3" />
      <path d="M 0 6 L 13 15 L 26 6" />
    </g>

    <!-- 28. Sunglasses (Row 5 Center Right) -->
    <g transform="translate(330, 470) rotate(8)">
      <path d="M 0 6 Q 6 0 12 6 L 14 6 Q 20 0 26 6" />
      <path d="M 0 6 C 0 13 10 15 11 8 Z" fill="currentColor" opacity="0.2" />
      <path d="M 15 8 C 16 15 26 13 26 6 Z" fill="currentColor" opacity="0.2" />
      <path d="M 0 6 C 0 13 10 15 11 8 Z" />
      <path d="M 15 8 C 16 15 26 13 26 6 Z" />
    </g>

    <!-- 29. Cloud & Rain (Row 5 Right) -->
    <g transform="translate(435, 460) rotate(-10)">
      <path d="M 5 16 A 6 6 0 0 1 16 12 A 8 8 0 0 1 29 16 A 5 5 0 0 1 27 24 H 5 A 5 5 0 0 1 5 16 Z" />
      <line x1="8" y1="26" x2="6" y2="30" />
      <line x1="16" y1="26" x2="14" y2="30" />
      <line x1="24" y1="26" x2="22" y2="30" />
    </g>

    <!-- 30. Hourglass (Row 5 Far Right) -->
    <g transform="translate(530, 465) rotate(15)">
      <path d="M 4 2 H 20 M 4 26 H 20" />
      <path d="M 5 2 L 12 14 L 5 26 M 19 2 L 12 14 L 19 26" />
      <polygon points="8,22 16,22 12,17" fill="currentColor" />
