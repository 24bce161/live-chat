    </g>

    <!-- 23. Planet Saturn (Row 4 Right) -->
    <g transform="translate(430, 350) rotate(22)">
      <circle cx="14" cy="14" r="9" />
      <ellipse cx="14" cy="14" rx="20" ry="5" transform="rotate(-20 14 14)" />
