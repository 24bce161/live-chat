    <!-- 20. Gift Box (Row 4 Middle Left) -->
    <g transform="translate(130, 350) rotate(-6)">
      <rect x="2" y="10" width="22" height="16" rx="2" />
      <rect x="0" y="6" width="26" height="5" rx="1" />
