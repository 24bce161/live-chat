    <!-- Filler Elements (Dots, Sparkles, Plus signs, Mini circles scattered across matrix) -->
    <circle cx="95" cy="45" r="2" fill="currentColor" />
    <circle cx="205" cy="55" r="1.5" fill="currentColor" />
    <circle cx="305" cy="40" r="2.5" fill="currentColor" opacity="0.6" />
    <circle cx="410" cy="65" r="2" fill="currentColor" />
    <circle cx="500" cy="50" r="1.5" fill="currentColor" />

    <path d="M 85 125 L 93 125 M 89 121 L 89 129" stroke-width="1.2" />
    <path d="M 195 165 L 201 165 M 198 162 L 198 168" stroke-width="1.2" />
    <path d="M 295 115 L 301 115 M 298 112 L 298 118" stroke-width="1.2" />
    <path d="M 395 175 L 401 175 M 398 172 L 398 178" stroke-width="1.2" />
    <path d="M 495 115 L 501 115 M 498 112 L 498 118" stroke-width="1.2" />

    <circle cx="85" cy="225" r="2" fill="currentColor" />
    <circle cx="195" cy="275" r="2" fill="currentColor" />
    <circle cx="305" cy="225" r="1.5" fill="currentColor" />
    <circle cx="405" cy="285" r="2.5" fill="currentColor" opacity="0.6" />
    <circle cx="495" cy="225" r="2" fill="currentColor" />

    <path d="M 75 330 L 81 330 M 78 327 L 78 333" stroke-width="1.2" />
    <path d="M 185 320 L 191 320 M 188 317 L 188 323" stroke-width="1.2" />
    <path d="M 290 310 L 296 310 M 293 307 L 293 313" stroke-width="1.2" />
    <path d="M 390 325 L 396 325 M 393 322 L 393 328" stroke-width="1.2" />
    <path d="M 490 310 L 496 310 M 493 307 L 493 313" stroke-width="1.2" />

    <circle cx="90" cy="430" r="2" fill="currentColor" />
    <circle cx="190" cy="445" r="1.5" fill="currentColor" />
    <circle cx="295" cy="435" r="2.5" fill="currentColor" opacity="0.6" />
    <circle cx="395" cy="440" r="2" fill="currentColor" />
    <circle cx="495" cy="430" r="1.5" fill="currentColor" />

    <circle cx="80" cy="540" r="2" fill="currentColor" />
    <circle cx="190" cy="535" r="2.5" fill="currentColor" opacity="0.6" />
    <circle cx="290" cy="545" r="1.5" fill="currentColor" />
    <circle cx="390" cy="535" r="2" fill="currentColor" />
    <circle cx="490" cy="540" r="2" fill="currentColor" />

    <!-- Extra squiggles & stars -->
    <path d="M 15 90 Q 20 85 25 90 T 35 90" stroke-width="1.2" />
    <path d="M 270 190 Q 275 185 280 190 T 290 190" stroke-width="1.2" />
    <path d="M 470 200 Q 475 195 480 200 T 490 200" stroke-width="1.2" />
    <path d="M 170 410 Q 175 405 180 410 T 190 410" stroke-width="1.2" />
    <path d="M 370 415 Q 375 410 380 415 T 390 415" stroke-width="1.2" />
