      <path d="M 13 6 C 10 1 4 1 8 6 Z M 13 6 C 16 1 22 1 18 6 Z" />
    </g>

    <!-- 21. Lightbulb (Row 4 Center) -->
    <g transform="translate(230, 355) rotate(10)">
      <path d="M 7 24 H 17 M 9 28 H 15 M 12 0 A 10 10 0 0 0 4 15 C 6 18 7 20 7 24 H 17 C 17 20 18 18 20 15 A 10 10 0 0 0 12 0 Z" />
